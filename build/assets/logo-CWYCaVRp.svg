<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Home Icon with Circuit -->
  <g transform="translate(50, 50)">
    <!-- House Shape -->
    <path d="M150 20 L50 90 L50 180 L150 180 L250 180 L250 90 Z" fill="#1e40af" stroke="#1e3a8a" stroke-width="3"/>
    
    <!-- Roof -->
    <path d="M30 90 L150 10 L270 90 L240 90 L150 30 L60 90 Z" fill="#0ea5e9" stroke="#0369a1" stroke-width="3"/>
    
    <!-- Circuit Pattern on Roof -->
    <circle cx="120" cy="50" r="8" fill="#34d399"/>
    <line x1="120" y1="50" x2="150" y2="50" stroke="#34d399" stroke-width="2"/>
    <circle cx="150" cy="50" r="6" fill="#10b981"/>
    <line x1="150" y1="50" x2="180" y2="50" stroke="#34d399" stroke-width="2"/>
    <circle cx="180" cy="50" r="8" fill="#34d399"/>
    
    <!-- Window -->
    <rect x="90" y="110" width="40" height="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <line x1="110" y1="110" x2="110" y2="150" stroke="#0369a1" stroke-width="2"/>
    <line x1="90" y1="130" x2="130" y2="130" stroke="#0369a1" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="170" y="120" width="40" height="60" rx="3" fill="#0c4a6e" stroke="#0369a1" stroke-width="2"/>
    <circle cx="200" cy="150" r="3" fill="#e0f2fe"/>
  </g>
  
  <!-- Company Name -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    SMART<tspan fill="#0ea5e9">FLOW</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#374151" letter-spacing="2">
    YOUR HOME IS SAFE WITH US
  </text>
</svg>
